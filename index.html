<style>
:root{
  --bg:#0b1220; --panel:#111c33; --panel2:#1b2a46; --line:#2a3b5c;
  --text:#e2e8f0; --soft:#aebbd0; --muted:#7c8ba5;
  --acc:#34d399; --acc-hi:#6ee7b7; --acc-bg:rgba(52,211,153,.12);
  --bad:#fb7185; --bad-bg:rgba(251,113,133,.12);
  --amber:#fbbf24; --amber-bg:rgba(251,191,36,.12);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
a{color:var(--acc-hi)}
header{position:sticky;top:0;z-index:30;background:rgba(11,18,32,.95);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:.6rem 1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.logo{font-weight:700;color:var(--acc);white-space:nowrap}
.tabs{display:flex;gap:.4rem;margin-left:auto;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);color:var(--soft);border-radius:9999px;
  padding:.35rem .9rem;font-size:.9rem;font-weight:700;cursor:pointer;text-decoration:none}
.tab.on{background:var(--acc-bg);border-color:var(--acc);color:var(--acc-hi)}
main{max-width:1320px;margin:0 auto;padding:1rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1.1rem 1.25rem;margin-bottom:1rem}
h1{font-size:1.5rem;margin:.2rem 0 .6rem}
h2{font-size:1.1rem;margin:0 0 .5rem}
h3{font-size:.95rem;margin:0 0 .2rem;color:#fff}
.muted{color:var(--muted)} .small{font-size:.9rem}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:.8rem;
  padding:.6rem 1rem;font-weight:700;cursor:pointer;font-size:.95rem;text-decoration:none;display:inline-block}
.btn:hover{background:#24375a}
/* the back button is present on every structure, including the first, so the row of buttons
   does not shift sideways as the student moves through the set */
.btn[disabled]{opacity:.35;cursor:default}
.btn[disabled]:hover{background:var(--panel2)}
.btn-primary{background:var(--acc);border-color:var(--acc);color:#04221a}
.btn-primary:hover{background:var(--acc-hi)}
/* the two buttons under an answer — the green way on, and the reminder below it when the answer
   was wrong. Both the full width of the ANSWER COLUMN, not of the card, so they line up with the
   answer buttons the student just chose from. */
.bred{display:block;width:100%;margin-top:.8rem;padding:.8rem 1rem;font-size:1.02rem;text-align:center}
ul.tecken{margin:.4rem 0 0;padding-left:1.1rem}
ul.tecken li{margin:.15rem 0}
.btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.9rem}

.ovning{display:grid;gap:1.2rem}
/* on a wide screen the two columns are the same height: the structure sets it with its 4:3 box,
   and the answer column stretches to match, so the buttons divide that height between them */
@media(min-width:1024px){
  .ovning{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:stretch}
  .ovning > div{min-height:0}
  #hoger{display:flex;flex-direction:column}
  #hoger .val{flex:1;grid-template-rows:repeat(6,minmax(0,1fr))}
  #hoger .alt{display:flex;align-items:center}
}
.ritruta{background:#fff;border-radius:.9rem;overflow:hidden;position:relative;aspect-ratio:4/3}
.ritruta svg{width:100%;height:100%;display:block}
.hitbox{cursor:pointer;transition:fill .1s}
.hitbox:hover{fill:rgba(52,211,153,.35)}
.vald{fill:rgba(52,211,153,.5);stroke:#059669;stroke-width:2}
.ratt{fill:rgba(52,211,153,.5);stroke:#059669;stroke-width:2.5}
.fel{fill:rgba(244,63,94,.45);stroke:#e11d48;stroke-width:2.5}
.missad{fill:none;stroke:#f59e0b;stroke-width:3;stroke-dasharray:4 3}

.val{display:grid;gap:.5rem;margin-top:.6rem}
.alt{text-align:left;border:1px solid var(--line);border-left:7px solid var(--k,var(--line));
  background:var(--panel2);color:var(--text);
  border-radius:.8rem;padding:.7rem .95rem;cursor:pointer;font-size:1rem;width:100%}
.alt:hover{background:#24375a;border-color:var(--k,var(--acc));border-left-color:var(--k,var(--acc))}
.alt b{display:block;color:#fff;font-size:1.02rem}
/* Okabe–Ito: a qualitative palette built to stay distinguishable with the common forms of
   colour vision deficiency. The same colour marks each class in the key. */
.k-PKS1{--k:#E69F00} .k-PKS2{--k:#CC79A7} .k-NRPS{--k:#009E73} .k-RIB{--k:#56B4E9} .k-RIPP{--k:#F0E442}
.prick{display:inline-block;width:.85rem;height:.85rem;border-radius:3px;background:var(--k);
  margin-right:.45rem;vertical-align:-1px;flex:none}
.alt-hjalp{border-style:dashed;border-left:7px dashed var(--line);color:var(--soft);font-weight:600}
.alt-hjalp b{color:var(--soft);font-weight:600}
.namn-kort{display:none}   /* the phone grid swaps these two round */
.svar{margin-top:.9rem;padding:.8rem 1rem;border-radius:.8rem;font-size:.95rem}
.svar.ok{background:var(--acc-bg);border:1px solid var(--acc)}
.svar.bad{background:var(--bad-bg);border:1px solid var(--bad)}
.leta{margin-top:.8rem;padding:.7rem .9rem;border-radius:.8rem;background:var(--amber-bg);
  border:1px solid rgba(251,191,36,.5);font-size:.95rem}
.leta b{color:var(--amber)}
.rakna{font-size:.9rem;color:var(--muted);margin-bottom:.4rem}
/* Counter and the two nav buttons as one row above the structure and the answers, spanning the
   full width of the card: the counter takes what it needs and the two buttons divide the rest. */
.topprad{display:flex;align-items:stretch;gap:.6rem;margin-bottom:.6rem}
.topprad .rakna{margin:0;font-size:1.02rem;white-space:nowrap;display:flex;align-items:center}
.nav{display:flex;gap:.6rem;flex:1}
.nav .btn{flex:1}
.poang{display:flex;gap:1.2rem;flex-wrap:wrap;font-size:.9rem;color:var(--soft);margin-top:.5rem}
.poang b{color:#fff}

/* the key the student can open at any time */
/* the panel lines up with the content card rather than spanning the whole window — at 1920px a
   full-width sheet put the text in one very long line and swamped the page */
/* centred over the page rather than stuck to the bottom of the window: anchored to the bottom
   edge it opened far below the box the student is actually looking at on a tall screen */
.nyckel-bak{position:fixed;inset:0;z-index:40;background:rgba(2,6,15,.72);
  display:flex;align-items:center;justify-content:center;padding:1rem}
.nyckel{width:min(100%, 1000px);max-height:82vh;overflow-y:auto;background:var(--panel);
  border:1px solid var(--acc);border-radius:1rem;padding:1rem 1.25rem 1.25rem;
  box-shadow:0 24px 60px rgba(0,0,0,.6)}
.nyckel-rad{border-bottom:1px solid var(--panel2);padding:.45rem 0 .45rem .6rem;border-left:5px solid var(--k,var(--line))}
.nyckel-rad:last-child{border-bottom:0}
.nyckel-rad h3{margin:0}
.tecken{color:var(--soft);margin-top:.1rem}
.tecken .sep{color:var(--muted);padding:0 .45rem}
.nyckelknapp{position:fixed;right:1rem;bottom:1rem;z-index:35}
table.granska{width:100%;border-collapse:collapse;font-size:.86rem}
table.granska th,table.granska td{border-bottom:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
table.granska th{color:var(--acc-hi);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
code{font-size:.85em;color:var(--acc-hi)}

/* ---- phone. These blocks must stay LAST in the stylesheet: they override rules above them at
   the same specificity, so moving them earlier silently turns them off. ---- */
/* The title and the two header buttons came to 377px against a 375px screen, so the nav wrapped
   onto a second line and cost ~48px of height. Trimming the padding keeps the header to one line
   and the exercise to one screen, which is the whole point: no scrolling on any of the 74. */
@media(max-width:480px){
  header{padding:.45rem .55rem;gap:.5rem}
  .tab{padding:.3rem .6rem;font-size:.82rem}
  main{padding:.6rem .6rem .1rem}
  .card{padding:.8rem .85rem;margin-bottom:.6rem}
  .topprad{gap:.5rem}
  .rakna-ord{display:none}   /* "Struktur 3 av 74" -> "3 av 74", so the row stays on one line */
  .nav .btn{padding:.5rem .4rem}
  /* A phone's address bar takes 80-100px off the nominal screen height, and an older phone is
     640-667px to begin with. So the structure gives up its 4:3 box and the answers a little
     padding, and the whole exercise lands on one screen. The drawing keeps its proportions
     inside the shorter box; it is only shown smaller. */
  .ritruta{aspect-ratio:auto;height:min(25vh,230px)}
  /* While the student is choosing, the exercise is exactly one screen tall and the STRUCTURE
     takes whatever the answers leave over — so a tall phone draws a bigger structure instead of
     leaving dead space at the bottom, and a short one still fits. The fixed height above is what
     the answered view falls back to, where the facit has to fit as well.
     100dvh rather than 100vh: on a phone vh counts the strip behind the address bar, which is
     not actually on screen, so 100vh would overflow by exactly that much. */
  body{height:100vh;height:100dvh;display:flex;flex-direction:column}
  header{position:static}
  main{flex:1;min-height:0;overflow-y:auto}
  .fyll{display:flex;flex-direction:column;height:100%;margin-bottom:0}
  .fyll .ovning{flex:1;min-height:0;display:flex;flex-direction:column;gap:.6rem}
  .fyll .ovning > div:first-child{flex:1;min-height:120px}
  .fyll .ritruta{height:100%}
  .fyll #hoger{flex:none}
  /* Six answers three across, as in the other module: two rows instead of six, which hands the
     structure back roughly 170px of height. The tiles are filled with the class colour rather
     than striped with it, and the labels switch to the short forms — the only way a third of a
     375px screen holds a class name. Dark text on all five: every one of the Okabe-Ito colours
     is light enough to carry it at better than 4.5:1. */
  .val{grid-template-columns:repeat(3,1fr);gap:.4rem}
  .alt{text-align:center;padding:.5rem .3rem;border:1px solid var(--k,var(--line));
    background:var(--k,var(--panel2));color:#10233a;
    display:flex;align-items:center;justify-content:center;min-height:3.2rem}
  .alt:hover{background:var(--k,var(--panel2));border-color:var(--k,var(--line))}
  .alt b{color:#10233a;font-size:.84rem;line-height:1.25}
  /* the help tile is not an answer, so it stays dark and dashed */
  .alt-hjalp{background:var(--panel2);border:1px dashed var(--line)}
  .alt-hjalp b{color:var(--soft)}
  .prick{display:none}
  /* On a phone the answer panel is just the verdict. The reasoning and the "nothing is marked"
     note are the bulk of it and there is no room for them beside a structure that now fills the
     screen; both are still there on a wider screen, where they cost nothing. */
  .ej-mobil{display:none}
  /* the grid gap plus the answer box's own margin came to ~34px of dead space between the
     structure and the verdict */
  .ovning{gap:.6rem}
  .svar{margin-top:0}
  .namn-lang{display:none}
  .namn-kort{display:inline}
}
</style>

<script>
/* =====================================================================
   DATA — läs strukturen
   Separate from index.html so the compound list can be edited on its own.

   Peptides are NOT written as SMILES by hand. They are given as residue
   lists and built into a structure by byggPeptid() below, which means the
   drawing can never drift from the sequence. The builder was checked
   against known masses: DRVYIHPF comes out at 1046 (angiotensin II) and
   YGGFL at 556 (leu-enkefalin).
   ===================================================================== */

/* ---- amino acid side chains, as written from the alpha carbon ---- */
const SIDO = {
  G: null,                      A: 'C',                 V: 'C(C)C',
  L: 'CC(C)C',                  I: '[C@@H](C)CC',       F: 'Cc1ccccc1',
  Y: 'Cc1ccc(O)cc1',            W: 'Cc1c[nH]c2ccccc12', S: 'CO',
  T: '[C@@H](C)O',              C: 'CS',                M: 'CCSC',
  N: 'CC(N)=O',                 Q: 'CCC(N)=O',          D: 'CC(O)=O',
  E: 'CCC(O)=O',                K: 'CCCCN',             R: 'CCCNC(N)=N',
  H: 'Cc1c[nH]cn1',
  // beyond the twenty — these are the giveaway that a ribosome was not involved
  Orn: 'CCCN',                  Abu: 'CC',              Nva: 'CCC',
  Aad: 'CCCC(O)=O'
};
const AA_NAMN = {
  G:'glycin', A:'alanin', V:'valin', L:'leucin', I:'isoleucin', F:'fenylalanin',
  Y:'tyrosin', W:'tryptofan', S:'serin', T:'treonin', C:'cystein', M:'metionin',
  N:'asparagin', Q:'glutamin', D:'asparaginsyra', E:'glutaminsyra', K:'lysin',
  R:'arginin', H:'histidin', P:'prolin',
  Orn:'ornitin', Abu:'α-aminosmörsyra', Nva:'norvalin', Aad:'aminoadipinsyra'
};

/* beta-D-glucopyranose as a substituent, attached through whatever atom ends the side
   chain: the oxygen of serine or threonine (an O-glycoside) or the sulfur of cysteine
   (an S-glycoside, which is what sublancin actually carries). */
const SOCKER = '[C@@H]1O[C@H](CO)[C@@H](O)[C@H](O)[C@H]1O';

/* One residue, written from its nitrogen to its carbonyl carbon.
   o.d = D-form, o.nme = methyl on the backbone nitrogen, o.gly = sugar on the side
   chain, o.dha = dehydroalanine (a double bond where the alpha hydrogen should be).
   o.ss = a ring-closure number appended to the side chain; two residues sharing a
   number are bonded through whatever atom their side chain ends in. Two cysteines
   give a disulfide (S–S); a cysteine and an alanine give a lanthionine thioether
   bridge (CH2–S–CH2), because the alanine closes the ring from its beta carbon. */
function rest(kod, o) {
  o = o || {};
  const kiral = o.d ? '[C@H]' : '[C@@H]';
  const N = o.nme ? 'N(C)' : 'N';
  if (o.dha) return N + 'C(=C)C(=O)';
  if (kod === 'P') return o.d ? 'N1CCC[C@@H]1C(=O)' : 'N1CCC[C@H]1C(=O)';
  if (kod === 'G') return N + 'CC(=O)';
  let sid = SIDO[kod];
  if (sid == null) return N + 'CC(=O)';
  if (o.gly) sid = sid + SOCKER;
  if (o.ss) sid = sid + '%' + o.ss;
  return N + kiral + '(' + sid + ')C(=O)';
}
/* opt.per = per-residue options keyed by index, opt.amid = amidated C-terminus,
   opt.pyro = pyroglutamate at the N-terminus, opt.cyklisk = head-to-tail ring. */
function byggPeptid(seq, opt) {
  opt = opt || {};
  const per = opt.per || {};
  let s = '';
  seq.forEach((k, idx) => {
    if (idx === 0 && opt.pyro) { s += 'O=C1CC[C@H](N1)C(=O)'; return; }   // pyroglutamat
    let bit = rest(k, per[idx]);
    if (idx === 0 && opt.cyklisk) bit = bit.replace(/^N(\(C\))?/, m => m + '%90');
    s += bit;
  });
  if (opt.cyklisk) return s.replace(/C\(=O\)$/, 'C%90=O');
  return s + (opt.amid ? 'N' : 'O');
}

/* =====================================================================
   THE FIVE CLASSES
   ===================================================================== */
const KLASSER = {
  /* `tecken` is deliberately terse: the reminder has to fit on screen without scrolling, and a
     student who has forgotten the difference needs a prompt, not a lecture. */
  /* `etikett` is the short label for the 3-wide grid of answers on a phone, where a third of the
     screen has to hold it. Luke's wording: the antiSMASH cluster names, which the students meet
     again if they ever run a genome through it. Both labels are rendered and CSS shows one, so
     they cannot drift apart in JS. */
  PKS1: { namn: 'Polyketid, PKS typ I', etikett: 'T1PKS', kort: 'stor böjlig ring',
    tecken: ['sluten med en <b>ester</b>', 'syre och metyler utmed kedjan', 'inga amidbindningar'] },
  PKS2: { namn: 'Polyketid, PKS typ II', etikett: 'T2PKS', kort: 'platt och styv',
    tecken: ['<b>hopvuxna aromatiska ringar</b>, ofta en kinon', 'aldrig en stor böjlig ring'] },
  NRPS: { namn: 'Icke-ribosomal peptid (NRPS)', etikett: 'NRPS', kort: 'ser knappt ut som en peptid alls',
    tecken: ['<b>tvärbundna ringar</b> och <b>klor</b>', '<b>metylerade kväven</b>, och då många',
             '<b>ester</b> i kedjan där amid borde stå', '<b>fettsyrasvans</b> inbyggd i peptiden',
             'β-laktam eller tiazolring'] },
  RIB:  { namn: 'Ribosomal peptid', etikett: 'Ribosomal peptid', kort: 'peptid, och det är allt',
    tecken: ['rak kedja, fria ändar', 'bara vanliga byggstenar'] },
  RIPP: { namn: 'Ribosomal peptid med PTM (RiPP)', etikett: 'RiPP', kort: 'vanliga byggstenar, men ihopknuten',
    tecken: ['<b>svavelbrygga</b> mellan två rester — S–S eller bara S',
             '<b>ringsluten</b> ände mot ände', '<b>socker</b> påhängt på en sidokedja',
             '<b>men</b> byggstenarna måste vara vanliga, annars är det NRPS'] }
};
/* The taught PTMs are named in one place so the key, the prompt and the data cannot drift
   apart. Note what this costs: neither a closed ring nor a sugar is evidence of an NRPS any
   more, since a RiPP can carry both. What separates them is the BUILDING BLOCKS — an NRPS
   peptide contains things a ribosome cannot load, a RiPP is ordinary amino acids that were
   modified after. Two compounds whose only tell was the ring (gramicidin S, tyrocidin A) were
   dropped for that reason: under these rules a student would correctly read them as RiPPs.
   Sugar was never a real tell here in the first place — it appears on the macrolides and on
   mithramycin too — so it was removed from the NRPS key line rather than kept as a half-truth. */
const PTM_LISTA = 'en svavelbrygga, en ring sluten ände mot ände, eller ett påhängt socker';
const KLASSORDNING = ['PKS1', 'PKS2', 'NRPS', 'RIB', 'RIPP'];

/* Evidence is found with substructure search, not hand-mapped atom lists: a new structure
   costs a SMILES and a class, not an atom map. `plocka` says which atoms OF THE MATCH are
   the evidence, so a single N-methyl amide lights up the methyl and its nitrogen rather
   than a five-atom blob. */
const BEVIS = {
  nmetyl:     { namn: 'Metylerat ryggradskväve', smarts: '[CH3][NX3]([#6])[CX3]=[OX1]', plocka: [0, 1], klass: 'NRPS' },
  // an esterified amino acid: the carbonyl whose alpha carbon bears a nitrogen has had its
  // carboxyl tied to an alcohol instead of to the next amine. Specific enough to leave plain
  // macrolactones alone, where no nitrogen sits alpha to the lactone carbonyl. An earlier
  // version required the alcohol carbon to carry its own carbonyl, which fitted valinomycin
  // but silently missed actinomycin D, whose ester sits on a threonine SIDE CHAIN.
  depsi:      { namn: 'Esterbindning i peptidkedjan', smarts: '[NX3][CX4][CX3](=[OX1])[OX2H0][CX4]', plocka: [2, 3, 4], klass: 'NRPS' },
  betalaktam: { namn: 'β-laktamring',           smarts: 'O=[CX3;R]1[NX3;R][CX4;R][CX4;R]1', klass: 'NRPS' },
  kloraryl:   { namn: 'Klorerad aromatisk ring', smarts: '[Cl][c]',                     plocka: [0],    klass: 'NRPS' },
  // a run of plain CH2 groups: a fatty acid built into the peptide. No plocka, so anywhere along
  // the chain counts — it is a stretch of the molecule rather than a single point. A polyketide
  // chain does not match, because its carbons carry oxygens and are CH, not CH2.
  // `vaxa` then grows the mark out to the WHOLE tail: the run of six is only a foothold, and on
  // its own it stopped at the first double bond and left most of echinocandin's chain unmarked.
  fettsyra:   { namn: 'Fettsyrasvans',           smarts: '[CH2][CH2][CH2][CH2][CH2][CH2]', vaxa: 'kedja', klass: 'NRPS' },
  // the phenoxazinone core of actinomycin: a six-ring carrying BOTH an oxygen and a nitrogen,
  // which no sugar, macrolactone or amino acid ring in this set does. `vaxa` then takes the
  // whole fused tricycle, because the lesson is that the core is not an amino acid at all —
  // lighting up one ring of three would understate it.
  aromkarna:  { namn: 'Aromatisk kärna — ingen aminosyra', smarts: '[#8;r6]1~[#6;r6]~[#6;r6]~[#7;r6]~[#6;r6]~[#6;r6]1', vaxa: 'ringsystem', klass: 'NRPS' },
  // narrowed from "any ring sulfur" once the lanthionine bridge below became a RiPP marker:
  // sulfur sharing a five-ring with a nitrogen is a thiazole/thiazoline, which no RiPP here has.
  // Matches bacitracin's thiazoline and penicillin's thiazolidine, both S-C-N-C-C around the
  // ring. The bonds are written as ~ (any order) because bacitracin's ring carries a C=N double
  // bond: with default single bonds the pattern matched saturated penicillin and nothing else.
  tiazol:     { namn: 'Tiazolring — svavel och kväve i samma ring', smarts: '[#16X2;R]1~[#6;R]~[#7;R]~[#6;R]~[#6;R]1', klass: 'NRPS' },
  disulfid:   { namn: 'Disulfidbrygga',          smarts: '[#16X2H0][#16X2H0]',          plocka: [0, 1], klass: 'RIPP' },
  // lanthionine: one sulfur bridging two CH2 groups. Methionine is excluded because its sulfur
  // sits next to a CH3, and the thiazoles above because theirs sit next to ring carbons.
  tioeterbrygga: { namn: 'Tioeterbrygga (lantionin)', smarts: '[CX4H2][#16X2H0][CX4H2]', plocka: [0, 1, 2], klass: 'RIPP' },
  // the glycosidic bond: a ring carbon bearing both its own ring oxygen and an exocyclic
  // O or S that leads out to the peptide. `vaxa` then lights up the WHOLE sugar — ring, every
  // OH and the CH2OH — rather than the two atoms of the bond, which is what the student is
  // actually being asked to recognise.

<script>
/* =====================================================================
   LÄS STRUKTUREN — the structural companion to Upptäcktsresan.
   The module teaches the inference narratively ("ribosomen kan inte bygga
   metylerade ryggradskväven"); here the student makes it on sight.

   Flow, per Luke: a structure comes up unnamed -> say what built it ->
   if it is an NRPS or a RiPP, mark the features that give it away.
   ===================================================================== */

let RDK = null, rdkFel = false;
const svgCache = {}, smilesCache = {};

/* Peptides are stored as residue lists and turned into structures here, so the drawing can
   never drift from the sequence. Everything else carries its own SMILES. */
function smilesFor(u) {
  if (u.smiles) return u.smiles;
  if (smilesCache[u.id]) return smilesCache[u.id];
  return (smilesCache[u.id] = byggPeptid(u.seq, u.opt));
}

function startRDKit() {
  if (typeof window.initRDKitModule === 'undefined') { rdkFel = true; rita(); return; }
  window.initRDKitModule().then(r => { RDK = r; try { r.prefer_coordgen(true); } catch (e) {} rita(); })
    .catch(() => { rdkFel = true; rita(); });
}

/* every element drawn in black, as in the other trainer — coloured heteroatoms would give the
   answer away before the student has looked at the bonds */
const SVART = { '-1':[0,0,0], '1':[0,0,0], '6':[0,0,0], '7':[0,0,0], '8':[0,0,0], '9':[0,0,0],
  '15':[0,0,0], '16':[0,0,0], '17':[0,0,0], '35':[0,0,0], '53':[0,0,0] };
/* Count bonds that cross another bond they share no atom with. A crossing reads as a mistake in
   the structure rather than as a tangle, which matters here because the student is being asked
   to judge the drawing. */
function korsningar(mb) {
  const L = mb.split(/\r?\n/), c = L[3] || '';
  const na = parseInt(c.substr(0, 3), 10), nb = parseInt(c.substr(3, 3), 10);
  if (!na || !nb) return 0;
  const p = [], b = [];
  for (let k = 0; k < na; k++) p.push({ x: parseFloat(L[4 + k].substr(0, 10)), y: parseFloat(L[4 + k].substr(10, 10)) });
  for (let k = 0; k < nb; k++) b.push([parseInt(L[4 + na + k].substr(0, 3), 10) - 1, parseInt(L[4 + na + k].substr(3, 3), 10) - 1]);
  const vk = (o, a, d) => (a.x - o.x) * (d.y - o.y) - (a.y - o.y) * (d.x - o.x);
  const korsar = (q, r, s, t) => {
    const d1 = vk(s, t, q), d2 = vk(s, t, r), d3 = vk(q, r, s), d4 = vk(q, r, t);
    return ((d1 > 0 && d2 < 0) || (d1 < 0 && d2 > 0)) && ((d3 > 0 && d4 < 0) || (d3 < 0 && d4 > 0));
  };
  let n = 0;
  for (let a = 0; a < b.length; a++) for (let d = a + 1; d < b.length; d++) {
    if (b[a][0] === b[d][0] || b[a][0] === b[d][1] || b[a][1] === b[d][0] || b[a][1] === b[d][1]) continue;
    if (korsar(p[b[a][0]], p[b[a][1]], p[b[d][0]], p[b[d][1]])) n++;
  }
  return n;
}
/* CoordGen lays out all but one of these structures best, but on ivermectin it draws a bond
   straight across the macrocycle. So: lay it out, count the crossings, and fall back to RDKit's
   own layout if CoordGen made any. The drawing and the hitboxes must sit on the SAME
   coordinates, so both go through here. */
function laggKoordinater(mol) {
  try {
    mol.set_new_coords(true);
    if (korsningar(mol.get_molblock()) > 0) mol.set_new_coords(false);
  } catch (e) {}
}
/* the bonds whose both ends are highlighted, so a marked region reads as a region rather than
   as a row of separate circles */
function bindningarMellan(mol, atomer) {
  const satt = new Set(atomer), ut = [];
  const L = mol.get_molblock().split(/\r?\n/), c = L[3] || '';
  const na = parseInt(c.substr(0, 3), 10), nb = parseInt(c.substr(3, 3), 10);
  if (!na || !nb) return ut;
  for (let k = 0; k < nb; k++) {
    const rad = L[4 + na + k] || '';
    const a = parseInt(rad.substr(0, 3), 10) - 1, b = parseInt(rad.substr(3, 3), 10) - 1;
    if (satt.has(a) && satt.has(b)) ut.push(k);
  }
  return ut;
}
function ritaMolekyl(smiles, markera, bredd, hojd) {
  bredd = bredd || 760; hojd = hojd || 590;
  const lista = markera ? [...markera].sort((a, b) => a - b) : [];
  const nyckel = smiles + '|' + lista.join(',') + '|' + bredd + 'x' + hojd;
  if (svgCache[nyckel]) return svgCache[nyckel];
  const mol = RDK.get_mol(smiles);
  if (!mol) return null;
  laggKoordinater(mol);
  /* One drawing style for all 71 structures. Earlier there were two: a canvas and a line width
     that switched at 55 atoms, plus scaleBondWidth, which ties stroke thickness to how large the
     molecule is drawn. A small molecule fills the canvas, so emodin and chrysophanol came out
     with ~3.5px strokes on screen against ~0.5px for daptomycin — a sevenfold difference, and
     the small anthraquinones looked like a different drawing program had made them.
     scaleBondWidth:false keeps the stroke constant, and fixedBondLength acts as a CAP on the
     scale: a small molecule is no longer blown up to fill the canvas, while one too big for the
     canvas is still scaled down to fit. So emodin and daptomycin now share a line weight and
     very nearly a bond length. */
  const detaljer = {
    width: bredd, height: hojd,
    bondLineWidth: 2, scaleBondWidth: false, fixedBondLength: 40,
    addChiralHs: false, baseFontSize: .55, atomColourPalette: SVART
  };
  if (lista.length) {
    detaljer.atoms = lista;
    detaljer.bonds = bindningarMellan(mol, lista);
    detaljer.highlightColour = [1, .84, .36];
  }
  const svg = mol.get_svg_with_highlights(JSON.stringify(detaljer));
  const n = mol.get_num_atoms();
  mol.delete();
  return (svgCache[nyckel] = { svg, n });
}
/* Each SMARTS match is one INSTANCE of a tell. Ciklosporin has seven N-methyls; the student is
   not asked to click all fourteen atoms, only to find an example of each kind of tell. So the
   evidence is kept grouped by instance, and marking any atom of any instance counts as having
   found that kind. The facit still shows every instance, so they see how common it is. */
/* The molecule as a plain graph — symbols, neighbours with bond order, and which atoms sit in a
   ring. Read out of the molblock we already parse elsewhere, plus one ring query to RDKit. */
function molGraf(mol) {
  const L = mol.get_molblock().split(/\r?\n/), c = L[3] || '';
  const na = parseInt(c.substr(0, 3), 10), nb = parseInt(c.substr(3, 3), 10);
  const sym = [], gran = [];
  if (!na) return null;
  for (let k = 0; k < na; k++) { sym.push(((L[4 + k] || '').substr(31, 3)).trim()); gran.push([]); }
  for (let k = 0; k < nb; k++) {
    const rad = L[4 + na + k] || '';
    const a = parseInt(rad.substr(0, 3), 10) - 1, b = parseInt(rad.substr(3, 3), 10) - 1;
    const ordning = parseInt(rad.substr(6, 3), 10) || 1;
    if (a < 0 || b < 0) continue;
    gran[a].push({ t: b, ordning }); gran[b].push({ t: a, ordning });
  }
  const ring = new Set();
  const q = RDK.get_qmol('[R]');
  if (q) {
    try { JSON.parse(mol.get_substruct_matches(q) || '[]').forEach(m => (m.atoms || []).forEach(a => ring.add(a))); } catch (e) {}
    q.delete();
  }
  return { sym, gran, ring };
}
/* Grow a highlight from the atoms a pattern matched out to the whole group a student would name.
   The SMARTS only has to FIND the thing; this decides how much of it lights up.
     'kedja'      the fatty tail: follow acyclic carbons out in both directions and take the
                  carbonyl oxygen along, stopping at a ring or at the amide nitrogen. The run of
                  six CH2 stops dead at the first double bond on its own, which left most of
                  echinocandin's tail dark.
     'socker'     the whole sugar: flood from the anomeric carbon but never cross the glycosidic
                  oxygen, so the ring, every OH and the CH2OH come along and the peptide does
                  not. Works because the sugar hangs off that one bond and nothing else.
     'ringsystem' every ring fused to the matched one, plus the atoms hanging off it that lead
                  nowhere else (=O, NH2, CH3), so a fused core lights up as a single block. The
                  links out to the peptide are not taken: those carbons carry more than one bond. */
function vaxUt(graf, start, sort, spar) {
  const med = new Set(start), ko = start.slice(), stopp = new Set(spar || []);
  while (ko.length) {
    const a = ko.pop();
    (graf.gran[a] || []).forEach(({ t, ordning }) => {
      if (med.has(t)) return;
      if (sort === 'kedja') {
        if (graf.sym[t] === 'O' && ordning === 2) { med.add(t); return; }
        if (graf.sym[t] !== 'C' || graf.ring.has(t)) return;
      } else if (sort === 'ringsystem') {
        if (!graf.ring.has(t)) { if ((graf.gran[t] || []).length === 1) med.add(t); return; }
      } else if (stopp.has(t)) { med.add(t); return; }
      med.add(t); ko.push(t);
    });
  }
  return [...med];
}
function bevisInstanser(smiles, nycklar) {
  const ut = [];
  if (!RDK) return ut;
  const mol = RDK.get_mol(smiles);
  if (!mol) return ut;
  let graf;
  (nycklar || []).forEach(k => {
    const b = BEVIS[k]; if (!b) return;
    const q = RDK.get_qmol(b.smarts);
    if (!q) return;
    /* Two matches that grow into the same atoms are ONE instance: a nine-carbon tail contains
       several overlapping runs of six CH2, and saying "Fettsyrasvans — 3 ställen" for a single
       tail would be worse than saying nothing. */
    const sedda = new Set();
    try {
      JSON.parse(mol.get_substruct_matches(q) || '[]').forEach(t => {
        const a = t.atoms || [];
        let atoms = (b.plocka || a.map((_, n) => n)).map(n => a[n]).filter(x => x !== undefined);
        if (b.vaxa && atoms.length) {
          if (graf === undefined) graf = molGraf(mol);
          if (graf) {
            const fran = b.vaxa === 'socker' ? [a[0]] : atoms;
            const spar = b.vaxa === 'socker' ? [a[2]] : [];
            if (fran.every(x => x !== undefined)) atoms = vaxUt(graf, fran, b.vaxa, spar);
          }
        }
        if (!atoms.length) return;
        const nyckel = atoms.slice().sort((x, y) => x - y).join(',');
        if (sedda.has(nyckel)) return;
        sedda.add(nyckel);
        ut.push({ nyckel: k, atoms });
      });
    } catch (e) {}
    q.delete();
  });
  mol.delete();
  return ut;
}
function bevisAtomer(smiles, nycklar) {
  const s = new Set();
  bevisInstanser(smiles, nycklar).forEach(x => x.atoms.forEach(a => s.add(a)));
  return s;
}
/* WHICH CLASSES MARK ANYTHING. Luke's call, and it is a teaching decision rather than a
   technical one: a polyketide and a plain ribosomal peptide are read from the whole molecule —
   the chain of two- and three-carbon units, the flat fused rings, the plain backbone — so
   lighting up a single lactone or quinone would teach the student to hunt for one group instead
   of reading the shape. NRPS and RiPP keep their marks, because there the tell really IS a
   specific group: a methylated nitrogen, an ester in the chain, a sulfur bridge, a sugar.
   The declared `bevis` are left in the data for the PKS entries, so this is one line to undo. */
const MARKERAR = { NRPS: true, RIPP: true };

/* What the answer highlights. For most molecules that is the declared tells. For the extreme
   ones (`allt: true`) it is every atom: in vancomycin almost nothing could have come from a
   ribosome, so lighting up two chlorines would understate it badly. The honest answer there is
   the whole molecule, and the text says so. */
function markeradeAtomer(u) {
  if (!MARKERAR[u.klass]) return new Set();
  const smi = smilesFor(u);
  if (u.allt) {
    const m = RDK.get_mol(smi);
    if (!m) return new Set();
    const n = m.get_num_atoms();
    m.delete();
    return new Set(Array.from({ length: n }, (_, k) => k));
  }
  return bevisAtomer(smi, u.bevis);
}

/* ============================ state ============================ */
let kon = [], i = 0, fas = 'klass', vald = null;
let resultat = [], nyckelOppen = false;
const blanda = a => { a = a.slice(); for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
const nu = () => kon[i];
function nyOmgang() { kon = blanda(UPPGIFTER); i = 0; nollstall(); resultat = []; rita(); }
function nollstall() { fas = 'klass'; vald = null; }

/* ============================ render ============================ */
const app = document.getElementById('app');
function rita() {
  ritaNyckel();
  if (!kon.length) return ritaStart();
  if (i >= kon.length) return ritaSlut();
  ritaUppgift();
}

function ritaStart() {
  app.innerHTML = `<div class="card">
    <h1>Läs strukturen</h1>
    <p>Du får se en molekyl utan namn. Frågan är alltid densamma: <b>vilket maskineri byggde
    grundstommen?</b> Svaret står i strukturen. Du behöver aldrig känna igen föreningen.</p>
    <!-- Only the three modifications the module actually teaches: ring closure, sulfur bridge,
         sugar. Methylated backbone nitrogens must NOT be listed here — they are an NRPS
         signature, not something an enzyme hangs on afterwards, and the key says so. -->
    <p>Fråga efter just <b>stommen</b>. Det som kan ha tillkommit efteråt är <b>ringslutning</b>,
    <b>svavelbryggor</b> och <b>påhängda socker</b>. Ingen av dem säger något om vilket maskineri
    som byggde kedjan från början.</p>
    <p>När du svarat <b>markeras det som avslöjar molekylen</b> direkt i strukturen, så att du ser
    var du skulle ha tittat. Låt dig inte luras av ett ensamt kännetecken: det finns peptider här
    som bär en disulfidbrygga eller ett socker och ändå inte är ribosomala. Det är
    <b>byggstenarna</b> som avgör.</p>
    <p class="small muted">Det här är den strukturella sidan av Upptäcktsresan. Där följer du hur ett
    läkemedel hittades; här övar du på att läsa av biosyntesen direkt ur molekylen.</p>
    <div class="btn-row">
      <button class="btn btn-primary" onclick="nyOmgang()">▶ Börja öva (${UPPGIFTER.length} strukturer)</button>
    </div>
  </div>`;
}

function ritaUppgift() {
  const u = nu();
  /* No question line here. It is the same question every time, and the five answers say what is
     being asked; printing it above every structure pushed the answers off the bottom of a phone
     screen, so the student had to scroll on all 71. It is stated once on the start page instead. */
  /* `fyll` in both phases: the structure takes whatever is left over before AND after answering.
     It only applied while choosing back when the facit followed the verdict and made the answered
     card taller than a screen; on a phone the facit is hidden now, so the answer panel is short
     and the structure should have the rest. If the panel ever is taller than the screen, the
     structure shrinks to its floor and `main` scrolls, which is the old behaviour. */
  app.innerHTML = `<div class="card fyll">
    <div class="topprad">
      <!-- nbsp, not a plain space: .rakna is a flex container, which trims the space at the
           edge of a flex item and would print "Struktur1 av 74" -->
      <div class="rakna"><span class="rakna-ord">Struktur&nbsp;</span>${i + 1} av ${kon.length}</div>
      <div class="nav">
        <button class="btn" onclick="foreg()"${i === 0 ? ' disabled' : ''}>◀ Föregående</button>
        <button class="btn" onclick="nasta()">${i + 1 < kon.length ? 'Nästa ➔' : 'Se resultatet ➔'}</button>
      </div>
    </div>
    <div class="ovning">
      <div>${ritrutaHTML(u)}</div>
      <div id="hoger">${hogerHTML(u)}</div>
    </div>
  </div>`;
  fyllRitruta(u);
}

function hogerHTML(u) {
  if (fas === 'klass') return valHTML();
  const ratt = vald === u.klass;
  const facit = `<div class="svar ${ratt ? 'ok' : 'bad'}">
      <b>${ratt ? '✅ Rätt.' : '❌ Inte riktigt.'}</b> Det här är <b>${KLASSER[u.klass].namn}</b>.
      <div class="ej-mobil" style="margin-top:.5rem">${u.facit}</div></div>`;
  /* The green bar is the way on whether they got it right or wrong, and it is the last thing in
     the answer column, so it is the width of the answers rather than of the whole card. */
  const nasta = `<button class="btn btn-primary bred" onclick="nasta()">${
    i + 1 < kon.length ? 'Nästa struktur ➔' : 'Se resultatet ➔'}</button>`;
  /* Green first, reminder under it: the way on is the main action even when they got it wrong. */
  return facit + tecknenHTML(u) + nasta + knappar(u);
}
/* The student classifies; the answer then points out the evidence itself. Hunting for the atoms
   by clicking was dropped — it tested whether they could find a needle, not whether they could
   read the structure, and for the tangled molecules there was no single needle to find. */
function tecknenHTML(u) {
  /* Deliberately says nothing about WHICH features: this text is shared by vancomycin and
     bleomycin, and they are extreme in different ways. The specifics belong in each facit. */
  if (u.allt) return `<div class="leta"><b>Markerat i strukturen: allt.</b><span class="ej-mobil">
    Det finns ingen enskild detalj att peka på här — <b>nästan ingenting</b> i molekylen är något
    en ribosom skulle kunna göra. Ringar, socker och byggstenar som inte står i den genetiska
    koden, alltihop på samma gång.</span></div>`;
  const inst = MARKERAR[u.klass] ? bevisInstanser(smilesFor(u), u.bevis) : [];
  if (!inst.length) {
    /* Different reasons for an empty highlight, and they must not share a text. A plain
       ribosomal peptide really has nothing to find; a cyclic RiPP has a modification that is a
       shape rather than an atom; a polyketide is given away by the whole chain and is never
       marked at all. Saying "a ribosome could have built this" would be wrong for the last two. */
    /* All of these say, at length, that there is nothing to look at. On a phone that is a box
       of prose explaining an absence, so the whole box goes rather than just its text. */
    if (u.opt && u.opt.cyklisk) return `<div class="leta ej-mobil"><b>Ingenting enskilt är markerat.</b>
      Ändringen är att kedjans båda ändar knutits ihop till en <b>ring</b> — följ ryggraden runt,
      den har varken början eller slut. Det är ingen enskild atom, utan formen.</div>`;
    if (u.klass === 'RIB') return `<div class="leta ej-mobil"><b>Ingenting är markerat</b>, och det är hela
      svaret. Det finns inget i strukturen som en ribosom inte kunde ha byggt.</div>`;
    if (u.klass === 'PKS1' || u.klass === 'PKS2') return `<div class="leta ej-mobil"><b>Ingenting är
      markerat</b>, och det är meningen. En polyketid läser du på <b>helheten</b>: en kedja byggd
      av två- och trekolsenheter, här ${KLASSER[u.klass].kort}. Ingen enstaka grupp avgör.</div>`;
    return `<div class="leta ej-mobil"><b>Ingenting enskilt är markerat.</b> Här är det <b>helheten</b> som
      avslöjar molekylen: ${KLASSER[u.klass].kort}. Ingen enstaka grupp räcker.</div>`;
  }
  const namnFor = k => (BEVIS[k] && BEVIS[k].namn) || k;
  const sorter = [...new Set(inst.map(x => x.nyckel))];
  return `<div class="leta"><b>Markerat i strukturen:</b>
    <ul class="tecken">${sorter.map(k => {
      const n = inst.filter(x => x.nyckel === k).length;
      return `<li>${namnFor(k)}${n > 1 ? ` <span class="muted">— ${n} ställen</span>` : ''}</li>`;
    }).join('')}</ul></div>`;
}
/* Föregående and Nästa live in the top row, above the structure and above the answers, so they
   sit in the same place whether or not the student has answered and on either layout.
   The reminder is offered only after a WRONG answer — that is the student who needs the rules.
   A correct answer gets the green bar across the card instead, and nothing else to weigh up. */
function knappar(u) {
  if (vald === u.klass) return '';
  return `<button class="btn bred" onclick="vaxlaNyckel()">🤔 Påminn mig om reglerna</button>`;
}
/* Just the name on the button. The tells live behind the key, so that answering means reading
   the structure rather than matching the structure against a hint printed next to the answer. */
/* Just the name on the button, each in its own colour. The tells sit behind the last button in
   the same box, so the reminder is where the student is already looking — and so the six
   together fill the same height as the structure beside them. */
/* Both the full name and the short one go into the markup; CSS shows whichever fits. On a phone
   the six answers sit three across, so a third of the screen has to hold the label. */
function valHTML() {
  const text = (lang, kort) =>
    `<span class="namn-lang">${lang}</span><span class="namn-kort">${kort}</span>`;
  return `<div class="val">${KLASSORDNING.map(k =>
    `<button class="alt k-${k}" data-k="${k}"><b><span class="prick"></span>${
      text(KLASSER[k].namn, KLASSER[k].etikett)}</b></button>`).join('')}
    <button class="alt alt-hjalp" onclick="vaxlaNyckel()"><b>${
      text('🤔 Påminn mig om reglerna', '🤔 Reglerna')}</b></button></div>`;
}

/* The box goes in empty and the drawing is added once the browser has laid it out, so RDKit can
   be given a canvas the SHAPE of the box it will sit in. It used to be a fixed 760x590 landscape
   canvas: on a phone, where the box is tall and narrow, that letterboxed badly — the white area
   grew but the molecule stayed small, with dead bands above and below it. */
function ritrutaHTML(u) {
  if (rdkFel) return `<div class="card small muted">Strukturen kunde inte ritas. Kontrollera internetanslutningen och ladda om sidan.</div>`;
  return `<div class="ritruta" id="ritruta"></div>`;
}
function fyllRitruta(u) {
  const ruta = document.getElementById('ritruta');
  if (!ruta || !RDK) return;
  /* rounded to 20px so that stepping back and forth, or a hair of layout drift, still hits the
     same cache entry instead of re-rendering the molecule */
  const b = Math.max(240, Math.round(ruta.clientWidth / 20) * 20);
  const h = Math.max(200, Math.round(ruta.clientHeight / 20) * 20);
  const r = ritaMolekyl(smilesFor(u), fas === 'klar' ? markeradeAtomer(u) : null, b, h);
  ruta.innerHTML = r ? r.svg
    : `<div class="small" style="padding:1rem;color:#333">Strukturen kunde inte ritas.</div>`;
}
/* ---- flow ---- */
document.addEventListener('click', e => {
  const alt = e.target.closest('.alt[data-k]');
  if (alt && fas === 'klass') {
    const u = nu();
    vald = alt.dataset.k;
    // indexed, not pushed: going back and answering again replaces that answer instead of
    // adding a second one for the same structure.
    resultat[i] = { id: u.id, klass: u.klass, ratt: vald === u.klass };
    fas = 'klar';
    ritaUppgift();
    return;
  }
});
/* The drawing is sized to the box, so turning the phone or resizing the window has to redraw it,
   or the molecule keeps the shape of the old screen. Debounced: a drag resizes continuously. */
let omritning;
addEventListener('resize', () => {
  clearTimeout(omritning);
  omritning = setTimeout(() => { if (kon.length && i < kon.length) rita(); }, 200);
});
function nasta() { i++; nollstall(); rita(); }
function foreg() { if (i > 0) { i--; nollstall(); rita(); } }

function ritaSlut() {
  const svar = resultat.filter(Boolean);
  const r = svar.filter(x => x.ratt).length;
  const perKlass = KLASSORDNING.map(k => {
    const d = svar.filter(x => x.klass === k);
    return d.length ? `<tr><td>${KLASSER[k].namn}</td><td>${d.filter(x => x.ratt).length} av ${d.length}</td></tr>` : '';
  }).join('');
  app.innerHTML = `<div class="card">
    <h1>${r} av ${resultat.length} rätt</h1>
    <table class="granska"><tbody>${perKlass}</tbody></table>
    <div class="btn-row"><button class="btn btn-primary" onclick="nyOmgang()">↺ Kör igen</button>
    <a class="btn" href="https://robertson922.github.io/Farmakognosi_A6_bacteria/#hem">Tillbaka till modulen</a></div>
  </div>`;
}

/* ---- the key: what to look for, available at any time ---- */
function vaxlaNyckel() { nyckelOppen = !nyckelOppen; ritaNyckel(); }
function ritaNyckel() {
  const plats = document.getElementById('nyckelplats');
  if (!nyckelOppen) { plats.innerHTML = ''; return; }
  plats.innerHTML = `<div class="nyckel-bak" onclick="if(event.target===this)vaxlaNyckel()"><div class="nyckel">
    <div style="display:flex;align-items:center;gap:1rem">
      <h2 style="margin:0">🤔 Skillnaderna — vad du ska leta efter</h2>
      <button class="btn" style="margin-left:auto" onclick="vaxlaNyckel()">✕ Stäng</button>
    </div>
    ${KLASSORDNING.map(k => `<div class="nyckel-rad k-${k}">
      <h3><span class="prick"></span>${KLASSER[k].namn} <span class="muted small">— ${KLASSER[k].kort}</span></h3>
      <div class="small tecken">${KLASSER[k].tecken.join('<span class="sep">·</span>')}</div>
    </div>`).join('')}
  </div></div>`;
}

startRDKit();
rita();
</script>
</body>
</html>
